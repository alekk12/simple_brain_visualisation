<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>Brain Visualiser</title>
<style>
  .wrap { width: 90%; max-width: 800px; margin: 40px auto; padding: 0 20px; }
  h1 { font-size: 1.5rem; margin: 0 0 8px; }
  p.sub { color: var(--text-sub); margin: 0 0 24px; font-size: 0.95rem; }
  .drop { display: block; border: 2px dashed var(--border); border-radius: 16px; padding: 40px 20px; text-align: center; background: var(--bg-card); cursor: pointer; transition: all 0.2s ease; }
  .drop:hover, .drop.drag { border-color: var(--text-accent); background: light-dark(#f0f4ff, #262a3a); }
  .drop input { display: none; }
  ul { list-style: none; padding: 0; margin: 32px 0 0; }
  li { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; background: var(--bg-card); }
  li a { color: var(--text-accent); text-decoration: none; font-weight: 500; }
  .empty { color: var(--text-sub); font-style: italic; text-align: center; margin-top: 20px; }
</style>
<div class="wrap">
  <h1>Brain visualiser</h1>
  <p class="sub">Upload a PDF or HTML file, open it, then highlight text to generate the visualisaton image.</p>
  <label class="drop" id="drop">
    <div><strong>Click to upload</strong> or drop files here</div>
    <input id="file" type="file" multiple accept=".pdf,.html,.htm">
  </label>
  <ul id="list"><li class="empty">Loading files...</li></ul>
</div>
<script>
  const drop = document.getElementById('drop');
  const input = document.getElementById('file');
  const list = document.getElementById('list');
  
  async function refresh() {
    try {
      const { files } = await (await fetch('/api/files')).json();
      list.innerHTML = files.length ? '' : '<li class="empty">No files.</li>';
      files.forEach(f => {
        const ext = f.split('.').pop().toLowerCase();
        const li = document.createElement('li');
        li.innerHTML = `<span class="badge">${ext}</span><a href="/view?file=${encodeURIComponent(f)}">${f}</a>`;
        list.appendChild(li);
      });
    } catch (e) { list.innerHTML = '<li class="empty">Error while loading files.</li>'; }
  }

  async function send(files) {
    const fd = new FormData();
    for (const f of files) fd.append('files', f);
    await fetch('/api/upload', { method: 'POST', body: fd });
    refresh();
  }

  input.addEventListener('change', () => send(input.files));
  ['dragover', 'dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('drag'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('drag'); }));
  drop.addEventListener('drop', e => { if (e.dataTransfer.files.length) send(e.dataTransfer.files); });
  refresh();
</script>
